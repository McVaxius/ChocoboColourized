name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore .\ChocoboColourized.sln

      - name: Build (Release)
        run: dotnet build .\ChocoboColourized.sln -c Release --no-restore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .\ChocoboColourized\bin\x64\Release\ChocoboColourized\latest.zip
